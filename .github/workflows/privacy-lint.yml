name: Privacy lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  privacy-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Run privacy lint tests
        run: python3 tools/test_privacy_lint.py
      - name: Check changed files
        env:
          PRIVACY_LINT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PRIVACY_LINT_REF_NAME: ${{ github.ref_name }}
          PRIVACY_LINT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # A new non-default branch has no previous push SHA.
          case "$PRIVACY_LINT_BASE" in
            0000000000000000000000000000000000000000)
              if [ "$PRIVACY_LINT_REF_NAME" != "$PRIVACY_LINT_DEFAULT_BRANCH" ]; then
                PRIVACY_LINT_BASE="origin/$PRIVACY_LINT_DEFAULT_BRANCH"
              fi
              ;;
          esac
          python3 tools/privacy_lint.py --changed --base "$PRIVACY_LINT_BASE"
